apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    model:
      architecture: simple_cnn
      num_classes: 10

    training:
      epochs: 3
      batch_size: 64
      learning_rate: 0.001
      early_stopping_patience: 2
      num_workers: 0

    data:
      dataset: cifar10
      data_dir: /app/data

    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
